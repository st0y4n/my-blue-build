---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: signing
  - type: files
    files:
      - source: base
        destination: /
  - type: dnf
    group-install:
        with-optional: true
        packages:
        - virtualization
  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
      enabled:
        - bootc-fetch-apply-updates.timer
        # Enable your server web UI and VM engine automatically at build time!
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtsecretd.socket
        - virtnodedevd.socket
        - virtnwfilterd.socket
        - virtproxyd.socket
        - virtproxyd-ro.socket
