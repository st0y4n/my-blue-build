name: bluebuild
on:
  schedule:
    - cron:
        "45 03 * * *" # build at 03:00 UTC every day

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # Fedora Latest
          - fedora-base-latest.yml
          - fedora-base-nvidia-latest.yml
          - fedora-base-nvidia-open-latest.yml
          - fedora-cosmic-latest.yml
          - fedora-cosmic-nvidia-latest.yml
          - fedora-cosmic-nvidia-open-latest.yml
          - fedora-silverblue-latest.yml
          - fedora-silverblue-nvidia-latest.yml
          - fedora-silverblue-nvidia-open-latest.yml
          - fedora-kinoite-latest.yml
          - fedora-kinoite-nvidia-latest.yml
          - fedora-kinoite-nvidia-open-latest.yml
          - fedora-kinoite-nvidia-latest-cachy.yml
          - fedora-kinoite-latest-cachy.yml

          # Fedora GTS
          - fedora-base-gts.yml
          - fedora-base-nvidia-gts.yml
          - fedora-base-nvidia-open-gts.yml
          - fedora-cosmic-gts.yml
          - fedora-cosmic-nvidia-gts.yml
          - fedora-cosmic-nvidia-open-gts.yml
          - fedora-silverblue-gts.yml
          - fedora-silverblue-nvidia-gts.yml
          - fedora-silverblue-nvidia-open-gts.yml
          - fedora-kinoite-gts.yml
          - fedora-kinoite-nvidia-gts.yml
          - fedora-kinoite-nvidia-open-gts.yml
          - fedora-silverblue-nvidia-latest-cachy.yml
          
          # Bazzite
          - bazzite-nvidia-kde.yml

          # Server
          - ublue-server.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract kernel key
        shell: bash
        env:
          KERNEL_SIGNING_SECRET: ${{ secrets.KERNEL_SIGNING_SECRET }}
        run: echo "${KERNEL_SIGNING_SECRET}" | base64 -d > MOK.priv

      - name: Extract Image Info from Recipe
        id: extract
        shell: bash
        run: |
          RECIPE_FILE="${{ matrix.recipe }}"
          
          # Handle potential directory paths dynamically
          if [ -f "recipes/$RECIPE_FILE" ]; then 
            PATH_TO_RECIPE="recipes/$RECIPE_FILE"
          elif [ -f "config/$RECIPE_FILE" ]; then 
            PATH_TO_RECIPE="config/$RECIPE_FILE"
          elif [ -f "$RECIPE_FILE" ]; then
            PATH_TO_RECIPE="$RECIPE_FILE"
          else
            echo "Error: Cannot find recipe file $RECIPE_FILE"
            exit 1
          fi
          
          # Parse YAML using yq 
          BASE_NAME=$(yq -e '.base-image' "$PATH_TO_RECIPE")
          TARGET_NAME=$(yq -e '.name' "$PATH_TO_RECIPE")
          VERSION=$(yq -e '.image-version // "latest"' "$PATH_TO_RECIPE")
          
          # Construct proper base image URL
          if [[ "$BASE_NAME" == *":"* ]]; then
            BASE_IMAGE="$BASE_NAME"
          else
            BASE_IMAGE="${BASE_NAME}:${VERSION}"
          fi
          
          # Construct proper target image URL (GHCR requires lowercase owner)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="ghcr.io/${OWNER}/${TARGET_NAME}:${VERSION}"
          
          echo "base=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "target=$TARGET_IMAGE" >> $GITHUB_OUTPUT

      - name: Check if base image updated
        id: check
        shell: bash
        run: |
          BASE_IMAGE="docker://${{ steps.extract.outputs.base }}"
          TARGET_IMAGE="docker://${{ steps.extract.outputs.target }}"
          
          echo "Checking Base: $BASE_IMAGE"
          echo "Checking Target: $TARGET_IMAGE"

          # 1. Get Upstream Base Creation Time
          UPSTREAM_TIME=$(skopeo inspect --format '{{.Created}}' "$BASE_IMAGE" 2>/dev/null)
          if [ -z "$UPSTREAM_TIME" ]; then
            echo "Error: Could not fetch upstream image metadata."
            # Failsafe: Build anyway if upstream API hiccups
            echo "needs-updating=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Strip redundant " UTC" text so GNU date parses correctly
          CLEAN_UPSTREAM="${UPSTREAM_TIME/ UTC/}"
          UP_EPOCH=$(date -d "$CLEAN_UPSTREAM" +%s)

          # 2. Get Target Image Creation Time
          TARGET_TIME=$(skopeo inspect --format '{{.Created}}' "$TARGET_IMAGE" 2>/dev/null || echo "none")

          # 3. Compare Timestamps
          if [ "$TARGET_TIME" = "none" ]; then
            echo "Target image not found (likely first run). Triggering build."
            echo "needs-updating=true" >> $GITHUB_OUTPUT
          else
            # Strip redundant " UTC" text here as well
            CLEAN_TARGET="${TARGET_TIME/ UTC/}"
            TG_EPOCH=$(date -d "$CLEAN_TARGET" +%s)
            
            if [ "$UP_EPOCH" -gt "$TG_EPOCH" ]; then
              echo "Upstream base is newer ($UPSTREAM_TIME) than target ($TARGET_TIME). Triggering build."
              echo "needs-updating=true" >> $GITHUB_OUTPUT
            else
              echo "Upstream base is older or equal. No build needed."
              echo "needs-updating=false" >> $GITHUB_OUTPUT
            fi
          fi

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        if: github.event_name != 'schedule' || steps.check.outputs.needs-updating == 'true'
        uses: blue-build/github-action@main
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          verify_install: true
          use_unstable_cli: true
          skip_checkout: true
          chunkah: true
          max_layers: 64
          maximize_build_space: true
